apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main-mvp
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: main
    app.kubernetes.io/part-of: kube-prometheus
stringData:
  alertmanager.yaml: |-
    ---
    global:
      resolve_timeout: 5m
    inhibit_rules:
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = critical
      target_matchers:
      - severity =~ warning|info
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = warning
      target_matchers:
      - severity = info
    - equal:
      - namespace
      source_matchers:
      - alertname = InfoInhibitor
      target_matchers:
      - severity = info
    receivers:
    - name: web.hook.prometheusalert
      webhook_configs:
      - url: http://prometheus-alert-center.monitoring.svc.cluster.local:8080/prometheusalert?type=fs&tpl=prometheus-feishu-app&fsurl=https://open.larksuite.com/open-apis/bot/v2/hook/89ad8801-6c43-4279-8eef-6a152917ea9e&at=starlightsponge@duck.com
    - name: Default
    - name: Watchdog
    - name: Critical
    - name: 'null'
    - name: lark-hash-mvp-warning
      webhook_configs:
      - url: https://open.larksuite.com/open-apis/bot/v2/hook/89ad8801-6c43-4279-8eef-6a152917ea9e
    route:
      group_by:
      - alertname
      - namespace
      - severity
      group_interval: 5m
      group_wait: 60s
      receiver: web.hook.prometheusalert
      repeat_interval: 3h
      routes:
      - matchers:
        - alertname = Watchdog
        receiver: Watchdog
      - matchers:
        - alertname = InfoInhibitor
        receiver: 'null'
      - matchers:
        - severity = critical
        receiver: web.hook.prometheusalert
      - matchers:
        - mvp = hash-warning
        receiver: lark-hash-mvp-warning
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 30m
